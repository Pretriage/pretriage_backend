spring.application.name=backend

# Postgresql config
spring.datasource.url=jdbc:postgresql://localhost:5432/pretriage_db?options=-c%20timezone=America/Argentina/Buenos_Aires
spring.datasource.username=myuser
spring.datasource.password=how5are#you2
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# validos: (validate, update, create, create-drop, none)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:create-drop}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# registro el link al servidor auth0 para oauth
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-bktuk8spi6fy0cal.us.auth0.com/

# habilito docker para tests de integración
spring.docker.compose.skip.in-tests=false

#auth0 params

auth0.client-id.machine-to-machine=${AUTH0_M2M_CLIENT_ID}
auth0.client-secret.machine-to-machine=${AUTH0_M2M_CLIENT_SECRET}
auth0.scope.machine-to-machine=${AUTH0_M2M_SCOPE}
auth0.base-path=https://dev-bktuk8spi6fy0cal.us.auth0.com
auth0.client-id.app=${AUTH0_APP_CLIENT_ID}

#google api params

google.api.key=${GOOGLE_MAPS_API_KEY}
google.places.base-url=https://places.googleapis.com/v1/places
google.routes.base-url=https://routes.googleapis.com/directions/v2:computeRoutes

#inyecto archivo con variables de entorno para desarrollo
spring.config.import=optional:file:.env[.properties]

# Invitaciones. "local" mantiene el handoff manual de desarrollo; "smtp" envía
# el enlace y nunca expone el token en la respuesta administrativa.
pretriage.invitations.email.mode=${PRETRIAGE_INVITATIONS_EMAIL_MODE:local}
pretriage.invitations.email.from=${PRETRIAGE_INVITATIONS_EMAIL_FROM:no-reply@pretriage.local}
pretriage.frontend.base-url=${PRETRIAGE_FRONTEND_BASE_URL:http://localhost:3000}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}

# Gemini para preguntas de texto y clasificacion final (texto, voz y recepcion).
# El chat requiere la clave; admision de recepcion conserva su fallback determinista.
pretriage.ia.gemini.api-key=${GEMINI_API_KEY:}
pretriage.ia.gemini.model=${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}
pretriage.ia.gemini.base-url=${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
pretriage.ia.gemini.connect-timeout=5s
pretriage.ia.gemini.request-timeout=${GEMINI_REQUEST_TIMEOUT:45s}
pretriage.ia.gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:8192}
pretriage.ia.gemini.max-attempts=${GEMINI_MAX_ATTEMPTS:2}
pretriage.ia.gemini.attempt-timeout=${GEMINI_ATTEMPT_TIMEOUT:20s}
pretriage.ia.gemini.retry-initial-backoff=${GEMINI_RETRY_INITIAL_BACKOFF:500ms}

# Bound external AI calls so reception can use its deterministic fallback when
# the provider is unavailable or does not answer.
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=45s

# Entrevista por voz (speech-to-speech) con Gemini Live. Gemini hace las
# preguntas; al cerrar, la API de texto de Gemini preclasifica el resumen.
# Sin GEMINI_API_KEY el endpoint de voz responde 503 y el chat de texto sigue igual.
pretriage.voz.gemini.api-key=${GEMINI_API_KEY:}
pretriage.voz.gemini.modelo=${GEMINI_LIVE_MODEL:models/gemini-3.8-live}
pretriage.voz.gemini.url=${GEMINI_LIVE_URL:wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent}
pretriage.voz.gemini.voz=${GEMINI_LIVE_VOICE:Kore}
pretriage.voz.gemini.idioma=${GEMINI_LIVE_LANGUAGE:es-US}
pretriage.voz.gemini.connect-timeout=10s
pretriage.voz.origenes-permitidos=${PRETRIAGE_VOZ_ORIGENES:*}

# tiempo estimado de atención triage médico
pretriage.estimacion.minutos-promedio-atencion=10

# Cambio de contraseña - token expiración y rate limit (configurable)
pretriage.cambio-contrasenia.expiracion-minutos=${PRETRIAGE_CAMBIO_CONTRASENIA_EXPIRACION:15}
pretriage.cambio-contrasenia.max-solicitudes-por-hora=${PRETRIAGE_CAMBIO_MAX_POR_HORA:3}
pretriage.cambio-contrasenia.ventana-horas=${PRETRIAGE_CAMBIO_VENTANA_HORAS:1}
pretriage.cambio-contrasenia.email.mode=${PRETRIAGE_CAMBIO_EMAIL_MODE:${PRETRIAGE_INVITATIONS_EMAIL_MODE:local}}
pretriage.cambio-contrasenia.email.from=${PRETRIAGE_CAMBIO_EMAIL_FROM:${PRETRIAGE_INVITATIONS_EMAIL_FROM:no-reply@pretriage.local}}

# Cambio de contraseña autenticado - reintentos y bloqueo temporal (configurable)
# Bloqueo de 1 día = 24 horas (spec: "bloquear durante 1 día")
pretriage.cambio-contrasenia-autenticado.max-intentos=${PRETRIAGE_CAMBIO_AUTENTICADO_MAX_INTENTOS:3}
pretriage.cambio-contrasenia-autenticado.horas-bloqueo=${PRETRIAGE_CAMBIO_AUTENTICADO_HORAS_BLOQUEO:24}

#Nombre del Bucket AWS S3
aws.s3.bucket-name=pretriage-bucket

# S3 es opcional para desarrollo local. Al activarlo se requieren las tres
# variables AWS declaradas debajo.
pretriage.storage.s3.enabled=${PRETRIAGE_STORAGE_S3_ENABLED:false}

aws.accessKeyId=${AWS_ACCESS_KEY_ID}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY}
aws.s3.region=${AWS_S3_REGION}
